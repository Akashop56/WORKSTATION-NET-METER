name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.0.0)"
        required: false
        default: "v1.0.0"
      name:
        description: "Release name"
        required: false
        default: "Workstation Net Meter 1.0.0"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Inspect debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          TESTS=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"tests={total} failures={failures} errors={errors} skipped={skipped}")
          PY
          )
          {
            echo "## Unit tests"
            echo
            echo "\`$TESTS\`"
            echo
            echo "## Debug APK"
            echo
            echo "\`\`\`"
            "$AAPT2" dump badging "$APK"
            echo
            echo "Signature:"
            "$APKSIGNER" verify --print-certs "$APK" | head -20
            echo "\`\`\`"
            echo
            echo "Install: \`adb install app-debug.apk\`"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.tag }}" \
            --title "${{ github.event.inputs.name }}" \
            --notes-file release-notes.md \
            app/build/outputs/apk/debug/*.apk
