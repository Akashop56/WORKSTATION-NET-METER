name: Emu diag

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d7814ba4-workstation-net-meter

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install API 34 image
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator" >/dev/null

      - name: Create AVD
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$PATH"
          echo "no" | avdmanager create avd -n diag -k "system-images;android-34;google_apis;x86_64" --device pixel_5 --force

      - name: Boot and diagnose
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/emulator:$SDK/platform-tools:$PATH"
          mkdir -p diag
          {
            echo "## host"
            uname -a
            echo "kvm: $(ls -la /dev/kvm 2>&1)"
            echo "nproc: $(nproc)"
            echo "mem:"; free -m
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls -la "$HOME/.android" 2>&1 || true
            echo "emulator version:"; emulator -version 2>&1 | head -5
            echo "avd list:"; emulator -list-avds 2>&1
          } > diag/host.txt 2>&1

          nohup emulator -avd diag -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel off -memory 2048 -cores 4 \
            > diag/emulator.log 2>&1 &
          EPID=$!
          echo "pid=$EPID" >> diag/host.txt

          for i in $(seq 1 9); do
            sleep 20
            {
              echo "--- tick $i ---"
              date -u
              adb devices 2>&1
              adb shell getprop sys.boot_completed 2>&1
              ps -p "$EPID" -o pid,stat,etime,cmd 2>&1 | head -3
            } >> diag/progress.txt 2>&1
          done

          {
            echo "===== emulator.log ====="
            tail -120 diag/emulator.log
          } > diag/emulator-tail.txt 2>&1

          git config user.name "Akashop56"
          git config user.email "110674731+Akashop56@users.noreply.github.com"
          git add -f diag
          git commit -m "chore: emulator diagnostic" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF#refs/heads/}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
