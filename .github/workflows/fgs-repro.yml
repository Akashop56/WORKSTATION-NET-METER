name: FGS repro

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d7814ba4-workstation-net-meter

permissions:
  contents: write

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install emulator host libraries
        run: |
          set +e
          sudo apt-get update -qq
          for p in libpulse0 libpulse0t64 libnss3 libxcomposite1 libxcursor1 \
                   libxi6 libasound2 libasound2t64 libgl1 libegl1 libxrandr2 \
                   libxss1 libgtk-3-0 libatk1.0-0; do
            sudo apt-get install -y -qq "$p" >/dev/null 2>&1
          done
          ldconfig
          echo "libpulse: $(ldconfig -p | grep -c libpulse)"
          ls -la /dev/kvm

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Install emulator + system image
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator" >/dev/null

      - name: Create AVD
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$PATH"
          echo "no" | avdmanager create avd -n repro -k "system-images;android-34;google_apis;x86_64" --device pixel_5 --force

      - name: Boot emulator
        run: |
          set +e
          SDK="$ANDROID_HOME"
          export PATH="$SDK/emulator:$SDK/platform-tools:$PATH"
          nohup emulator -avd repro -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on -memory 3072 -cores 4 \
            > emulator.log 2>&1 &
          echo "emulator pid $!"
          sleep 20
          adb devices
          tail -20 emulator.log

      - name: Wait for boot
        timeout-minutes: 30
        run: |
          set +e
          SDK="$ANDROID_HOME"
          export PATH="$SDK/platform-tools:$PATH"
          adb wait-for-device
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "BOOTED after $((i*5))s"; break; fi
            sleep 5
          done
          {
            echo "boot_completed=$(adb shell getprop sys.boot_completed 2>&1)"
            echo "sdk=$(adb shell getprop ro.build.version.sdk 2>&1)"
            echo "release=$(adb shell getprop ro.build.version.release 2>&1)"
            echo "model=$(adb shell getprop ro.product.model 2>&1)"
          } > boot.txt 2>&1

      - name: Install + launch + tap Start
        timeout-minutes: 30
        run: |
          set +e
          SDK="$ANDROID_HOME"
          export PATH="$SDK/platform-tools:$PATH"
          adb logcat -c
          adb install -r app/build/outputs/apk/debug/app-debug.apk > install.txt 2>&1
          adb shell pm grant com.workstation.netmeter android.permission.POST_NOTIFICATIONS >> install.txt 2>&1
          adb shell am start -n com.workstation.netmeter/.MainActivity >> install.txt 2>&1
          sleep 20
          adb shell uiautomator dump /sdcard/ui1.xml >> install.txt 2>&1
          adb pull /sdcard/ui1.xml ui1.xml >> install.txt 2>&1
          python3 - <<'PY' > tap.txt
          import re
          xml = open('ui1.xml', encoding='utf-8').read()
          print('ALL TEXTS:', re.findall(r'text="([^"]*)"', xml))
          nodes = []
          for m in re.finditer(r'<node[^>]*>', xml):
              node = m.group(0)
              t = re.search(r'text="([^"]*)"', node)
              d = re.search(r'content-desc="([^"]*)"', node)
              b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if not b:
                  continue
              label = ((t.group(1) if t else '') + '|' + (d.group(1) if d else '')).strip()
              nodes.append((label, b.groups()))
          for label, b in nodes:
              print('NODE:', label, b)
          best = None
          for label, b in nodes:
              if 'Start Monitoring' in label or 'Monitoring Start' in label:
                  best = b
          if best is None:
              for label, b in nodes:
                  if 'allow' in label.lower():
                      best = b
          if best:
              print('TAP_AT', (int(best[0]) + int(best[2])) // 2, (int(best[1]) + int(best[3])) // 2)
          else:
              print('NO_BUTTON_FOUND')
          PY
          cat tap.txt
          if grep -q TAP_AT tap.txt; then
            X=$(awk '/TAP_AT/{print $2}' tap.txt)
            Y=$(awk '/TAP_AT/{print $3}' tap.txt)
            adb shell input tap "$X" "$Y"
            sleep 10
            adb shell uiautomator dump /sdcard/ui2.xml
            adb pull /sdcard/ui2.xml ui2.xml
          fi

      - name: Capture logcat
        if: always()
        run: |
          set +e
          SDK="$ANDROID_HOME"
          export PATH="$SDK/platform-tools:$PATH"
          mkdir -p repro-logs
          adb logcat -d > repro-logs/logcat.txt 2>/dev/null
          adb shell dumpsys activity services com.workstation.netmeter > repro-logs/services.txt 2>/dev/null
          adb shell dumpsys notification --noredact > repro-logs/notification.txt 2>/dev/null
          {
            echo "===== FATAL / AndroidRuntime ====="
            grep -n -A 60 -E "FATAL EXCEPTION|AndroidRuntime" repro-logs/logcat.txt | head -250
            echo "===== netmeter ====="
            grep -n -i "netmeter" repro-logs/logcat.txt | head -250
            echo "===== foreground / notification ====="
            grep -n -i "foregroundservice\|startForeground\|Bad notification\|SecurityException\|RemoteServiceException" repro-logs/logcat.txt | head -150
          } > repro-logs/summary.txt 2>&1
          ls -la repro-logs > repro-logs/files.txt

      - name: Commit logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git config user.name "Akashop56"
          git config user.email "110674731+Akashop56@users.noreply.github.com"
          git add -f repro-logs ui1.xml ui2.xml tap.txt boot.txt install.txt emulator.log diag 2>/dev/null
          git commit -m "chore: fgs repro logs" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF#refs/heads/}" || true
