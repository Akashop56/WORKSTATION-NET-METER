name: FGS repro

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d7814ba4-workstation-net-meter

permissions:
  contents: write

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Install emulator + system image
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator" >/dev/null
          sdkmanager --list_installed > sdk-installed.txt

      - name: Create AVD
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$PATH"
          echo "no" | avdmanager create avd -n repro -k "system-images;android-34;google_apis;x86_64" --device pixel_5 --force
          avdmanager list avd > avd-list.txt

      - name: Boot emulator
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/emulator:$SDK/platform-tools:$PATH"
          nohup emulator -avd repro -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel off -memory 3072 -cores 2 \
            > emulator.log 2>&1 &
          echo "emulator pid $!"

      - name: Wait for boot
        timeout-minutes: 120
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/platform-tools:$PATH"
          adb wait-for-device
          echo "device online" > boot.txt
          for i in $(seq 1 360); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "boot completed after $((i*10))s" >> boot.txt; break; fi
            sleep 10
          done
          adb shell getprop ro.build.version.sdk >> boot.txt 2>&1
          adb shell getprop ro.build.version.release >> boot.txt 2>&1
          adb shell getprop ro.product.model >> boot.txt 2>&1

      - name: Install + launch + tap Start
        timeout-minutes: 60
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/platform-tools:$PATH"
          adb logcat -c
          adb install -r app/build/outputs/apk/debug/app-debug.apk > install.txt 2>&1
          adb shell am start -n com.workstation.netmeter/.MainActivity >> install.txt 2>&1
          sleep 15
          adb shell uiautomator dump /sdcard/ui1.xml >> install.txt 2>&1
          adb pull /sdcard/ui1.xml ui1.xml >> install.txt 2>&1
          python3 - <<'PY' > tap.txt
          import re
          xml = open('ui1.xml', encoding='utf-8').read()
          print('ALL TEXTS:', re.findall(r'text="([^"]*)"', xml))
          print('ALL CONTENT-DESC:', re.findall(r'content-desc="([^"]*)"', xml))
          best = None
          for m in re.finditer(r'<node[^>]*>', xml):
              node = m.group(0)
              t = re.search(r'text="([^"]*)"', node)
              d = re.search(r'content-desc="([^"]*)"', node)
              b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if not b: continue
              label = (t.group(1) if t else '') + '|' + (d.group(1) if d else '')
              if 'Start Monitoring' in label or 'Start' in label or 'Monitoring' in label:
                  print('CANDIDATE:', label, b.groups())
                  best = b.groups()
          if best:
              x = (int(best[0]) + int(best[2])) // 2
              y = (int(best[1]) + int(best[3])) // 2
              print('TAP_AT', x, y)
          else:
              print('NO_BUTTON_FOUND')
          PY
          cat tap.txt
          if grep -q TAP_AT tap.txt; then
            X=$(awk '/TAP_AT/{print $2}' tap.txt)
            Y=$(awk '/TAP_AT/{print $3}' tap.txt)
            echo "tapping $X $Y" >> tap.txt
            adb shell input tap "$X" "$Y" >> tap.txt 2>&1
            sleep 8
            adb shell uiautomator dump /sdcard/ui2.xml >> tap.txt 2>&1
            adb pull /sdcard/ui2.xml ui2.xml >> tap.txt 2>&1
          fi

      - name: Capture logcat
        if: always()
        run: |
          SDK="$ANDROID_HOME"
          export PATH="$SDK/platform-tools:$PATH"
          mkdir -p repro-logs
          adb logcat -d > repro-logs/logcat.txt 2>/dev/null || true
          adb shell dumpsys activity services com.workstation.netmeter > repro-logs/services.txt 2>/dev/null || true
          adb shell dumpsys notification --noredact > repro-logs/notification.txt 2>/dev/null || true
          adb shell "ps -A | grep netmeter" > repro-logs/process.txt 2>/dev/null || true
          {
            echo "===== FATAL / AndroidRuntime ====="
            grep -n -A 80 -E "FATAL EXCEPTION|AndroidRuntime" repro-logs/logcat.txt | head -300
            echo "===== netmeter ====="
            grep -n -i "netmeter" repro-logs/logcat.txt | head -300
            echo "===== ForegroundService ====="
            grep -n -i "foregroundservice\|startForeground\|Bad notification\|SecurityException" repro-logs/logcat.txt | head -200
          } > repro-logs/summary.txt 2>&1
          ls -la repro-logs > repro-logs/files.txt

      - name: Commit logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Akashop56"
          git config user.email "110674731+Akashop56@users.noreply.github.com"
          git add -f repro-logs ui1.xml ui2.xml tap.txt boot.txt install.txt avd-list.txt sdk-installed.txt emulator.log 2>/dev/null || true
          git commit -m "chore: fgs repro logs" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF#refs/heads/}" || true
